# Production compose for a single cloud server (any provider — EC2, a DigitalOcean/Hetzner/Linode
# VM, a GCP/Azure instance, anything that can run Docker). Distinct from docker-compose.yml, which
# is pinned to the `dev` target for local development only (see docs/DEVELOPER.md).
#
# `name:` below is deliberate, not cosmetic: without it, Compose derives the project name from the
# directory (madre_pluse either way) and both files would build images named madre_pluse-api /
# madre_pluse-web — building this file would silently overwrite the dev stack's images with the
# prod target, and the next plain `docker compose up` on the dev file would then run the wrong
# image (found the hard way while testing this file — see DEVELOPER.md).
name: madre_pluse_prod
#
# Differences from docker-compose.yml:
#  - api/web build the `prod` Dockerfile stages, not `dev` — no bind-mounted source, no dev server.
#  - No MinIO here: attachments need a real S3-compatible bucket with a *public* endpoint (presigned
#    download URLs are fetched directly by the browser, never through the API) — use real AWS S3,
#    DigitalOcean Spaces, Cloudflare R2, etc. and put its credentials in apps/api/.env.production.
#  - Postgres/Redis are not published to the host at all — only the api container can reach them,
#    over the compose network. Nothing but Caddy (80/443) is exposed to the internet.
#  - Caddy terminates TLS (automatic Let's Encrypt certs) and reverse-proxies to web/api, including
#    Socket.io's WebSocket upgrade, which Caddy handles with no extra config.
#
# Usage:
#   cp .env.prod.example .env.prod && cp apps/api/.env.example apps/api/.env.production
#   # fill in real values in both, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api npx prisma migrate deploy
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_SOCKET_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
